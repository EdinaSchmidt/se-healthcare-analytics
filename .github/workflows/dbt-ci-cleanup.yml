name: dbt CI cleanup

# Drops the PR's CI datasets (dbt_ci_pr_<n>, dbt_ci_pr_<n>_staging, ...) when the PR closes.
# Uses the BigQuery REST API directly: the bq CLI prints setup text that breaks JSON parsing.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: se-healthcare-analytics
      PREFIX: dbt_ci_pr_${{ github.event.pull_request.number }}

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DBT_SA }}
          token_format: access_token

      - name: Drop PR datasets
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API="https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/datasets"

          curl -sSf -H "Authorization: Bearer ${TOKEN}" "${API}?maxResults=1000" > datasets.json
          ids=$(jq -r '.datasets[]?.datasetReference.datasetId' datasets.json)
          datasets=$(echo "$ids" | grep -E "^${PREFIX}(_|$)" || true)

          if [ -z "$datasets" ]; then
            echo "No datasets matching ${PREFIX}"
            exit 0
          fi
          for ds in $datasets; do
            echo "Dropping $ds"
            curl -sSf -X DELETE -H "Authorization: Bearer ${TOKEN}" "${API}/${ds}?deleteContents=true"
          done