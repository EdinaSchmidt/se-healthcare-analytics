name: dbt CI cleanup

# Drops the PR's CI datasets (dbt_ci_pr_<n>, dbt_ci_pr_<n>_staging, ...) when the PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: se-healthcare-analytics
      PREFIX: dbt_ci_pr_${{ github.event.pull_request.number }}

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DBT_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Drop PR datasets
        run: |
          datasets=$(bq ls --project_id="$PROJECT_ID" --max_results=1000 --format=json \
            | jq -r '.[].datasetReference.datasetId' \
            | grep -E "^${PREFIX}(_|$)" || true)
          for ds in $datasets; do
            echo "Dropping $ds"
            bq rm -r -f -d "${PROJECT_ID}:${ds}"
          done