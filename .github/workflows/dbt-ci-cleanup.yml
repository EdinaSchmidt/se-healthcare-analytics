name: dbt CI cleanup

# Drops the PR's CI datasets (dbt_ci_pr_<n>, dbt_ci_pr_<n>_staging, ...) when the PR closes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: se-healthcare-analytics
      PREFIX: dbt_ci_pr_${{ github.event.pull_request.number }}

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DBT_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Drop PR datasets
        run: |
          set -euo pipefail
          # First bq call in a fresh runner prints setup text; absorb it.
          bq --headless ls --project_id="$PROJECT_ID" > /dev/null 2>&1 || true

          bq --headless ls --project_id="$PROJECT_ID" --max_results=1000 --format=json > datasets.json

          # jq runs on its own so a parse error fails the step;
          # only grep's "no match" is tolerated.
          ids=$(jq -r '.[].datasetReference.datasetId' datasets.json)
          datasets=$(echo "$ids" | grep -E "^${PREFIX}(_|$)" || true)

          if [ -z "$datasets" ]; then
            echo "No datasets matching ${PREFIX}"
            exit 0
          fi
          for ds in $datasets; do
            echo "Dropping $ds"
            bq --headless rm -r -f -d "${PROJECT_ID}:${ds}"
          done