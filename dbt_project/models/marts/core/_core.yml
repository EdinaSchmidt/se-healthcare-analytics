models:
  - name: dim_kpi
    columns:
      - name: kpi_id
        data_tests:
          - unique
          - not_null
      - name: kpi_name
        data_tests:
          - not_null

  - name: dim_region
    columns:
      - name: region_id
        data_tests:
          - unique
          - not_null
      - name: region_short_name
        data_tests:
          - not_null

  - name: fct_kpi_values
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - kpi_id
              - region_id
              - period_start
    columns:
      - name: kpi_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_kpi')
                field: kpi_id
      - name: region_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_region')
                field: region_id
      - name: amount
        data_tests:
          - not_null:
              config:
                severity: warn


