models:
  - name: rpt_region_expansion_shortlist
    description: This table has one row per year per region. It is used for BI purposes to decide in which region does it worth to open a new vårdcentral.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns: [region_id, year]
    columns:
      - name: region_id
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null