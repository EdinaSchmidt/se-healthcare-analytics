title: "Patient experience"
notes: >
  How patients rate their primary care doctor visit in the National Patient Survey (NPE), by region,
  dimension and question, against Sweden. Region figures are SKR's own aggregates; health-centre counts
  use each centre's confidence interval.
# source, theme, width, title casing and the Sweden colour pin come from the shared base
extends: [../chart_styles/base.yml]
style:
  charts:
    category_colors:
      # the six NPE dimensions, wherever a chart colours by dimension without layers
      dimension_name:
        values:
          Care and treatment: category.blue
          Participation: category.sky
          Respectful treatment: category.green
          Continuity: category.gold
          Information: category.orange
          Accessibility: category.purple

variables:
  question_region:
    input: select
    label: "Region (questions)"
    notes: Region whose question scores chart 5 shows, with Sweden's as markers. Sweden by default.
    options: { query: region_options, column: region_short_name }
    default: Sweden

queries:
  region_options:
    notes: Sweden first, then the regions with NPE results, for the Region (questions) filter.
    sql: |
      SELECT region_short_name
      FROM `se-healthcare-analytics.reporting.rpt_experience_by_question`
      GROUP BY region_short_name, is_national
      ORDER BY is_national DESC, region_short_name

  kpi_summary:
    notes: >
      One row for the KPI cards: Sweden's overall experience, how many regions are clearly above or
      below it, health centres clearly below it, and Sweden's weakest dimension and question.
    sql: |
      WITH overall AS (
        SELECT *
        FROM `se-healthcare-analytics.reporting.rpt_experience_by_region`
        WHERE measure_code = 'overall_experience'
      ),
      weakest_dimension AS (
        SELECT measure_name, score
        FROM `se-healthcare-analytics.reporting.rpt_experience_by_region`
        WHERE is_national AND measure_code != 'overall_experience'
        ORDER BY score
        LIMIT 1
      ),
      weakest_question AS (
        SELECT question_short_name, score
        FROM `se-healthcare-analytics.reporting.rpt_experience_by_question`
        WHERE is_national
        ORDER BY score
        LIMIT 1
      )
      SELECT
        nat.score AS sweden_score,
        FORMAT('NPE %d, doctor visits', nat.survey_year) AS survey_label,
        FORMAT('%d / %d',
          (SELECT COUNTIF(comparison_to_national = 'Clearly above Sweden') FROM overall),
          (SELECT COUNTIF(comparison_to_national = 'Clearly below Sweden') FROM overall)) AS regions_above_below,
        FORMAT('of %d regions with results', (SELECT COUNTIF(NOT is_national) FROM overall)) AS regions_label,
        nat.share_of_centres_clearly_below_national AS centres_below_share,
        FORMAT("%'d of %'d health centres", nat.centres_clearly_below_national, nat.centres_scored) AS centres_below_label,
        FORMAT('%s %.1f', weakest_dimension.measure_name, weakest_dimension.score) AS weakest_dimension,
        FORMAT('lowest question: %s %.1f', weakest_question.question_short_name, weakest_question.score) AS weakest_question
      FROM overall AS nat
      CROSS JOIN weakest_dimension
      CROSS JOIN weakest_question
      WHERE nat.is_national

  overall_by_region:
    notes: >
      Overall experience per region with Sweden's score on every row for the reference line, the
      comparison group (whole confidence interval above / below Sweden, or not) and label text. Regions
      sorted by score (row_order 3..), after two blank rows that carry the Sweden label. Chart 2 reads
      the same rows so the two charts line up.
    sql: |
      WITH regions AS (
        SELECT
          region_short_name,
          score,
          national_score,
          comparison_to_national,
          centres_scored,
          centres_clearly_below_national,
          share_of_centres_clearly_below_national,
          deviation_from_national,
          -- national share of centres clearly below, for chart 2's reference line
          (SELECT share_of_centres_clearly_below_national
           FROM `se-healthcare-analytics.reporting.rpt_experience_by_region`
           WHERE is_national AND measure_code = 'overall_experience') AS national_share_below
        FROM `se-healthcare-analytics.reporting.rpt_experience_by_region`
        WHERE measure_code = 'overall_experience'
          AND NOT is_national
      ),
      labelled AS (
        SELECT
          *,
          -- signed points with one decimal; U+2212 matches d3's minus
          IF(ROUND(deviation_from_national, 1) = 0, '±0.0', REPLACE(FORMAT('%+.1f', deviation_from_national), '-', '−')) AS deviation_label,
          FORMAT('%d of %d', centres_clearly_below_national, centres_scored) AS below_label
        FROM regions
      )
      SELECT
        region_short_name,
        2 + ROW_NUMBER() OVER (ORDER BY score DESC, region_short_name) AS row_order,
        score,
        national_score,
        comparison_to_national,
        IF(score >= national_score, deviation_label, '') AS score_bar_label,
        IF(score >= national_score, '', deviation_label) AS score_line_label,
        share_of_centres_clearly_below_national,
        national_share_below,
        IF(share_of_centres_clearly_below_national >= national_share_below, below_label, '') AS below_bar_label,
        IF(share_of_centres_clearly_below_national >= national_share_below, '', below_label) AS below_line_label
      FROM labelled
      UNION ALL
      -- blank band names (one and two spaces) keep the axis empty; NULL measures draw no bar
      SELECT ' ', 1, NULL, ANY_VALUE(national_score), 'Not clearly different', '',
        FORMAT('Sweden %.1f', ANY_VALUE(national_score)),
        NULL, ANY_VALUE(national_share_below), '',
        FORMAT('Sweden %d %%', CAST(ROUND(ANY_VALUE(national_share_below) * 100) AS INT64))
      FROM regions
      UNION ALL
      SELECT '  ', 2, NULL, ANY_VALUE(national_score), 'Not clearly different', '', '', NULL, ANY_VALUE(national_share_below), '', ''
      FROM regions
      ORDER BY row_order

  dimension_heat:
    notes: >
      Region × measure difference from Sweden in points (overall experience first, then the six
      dimensions), regions in chart 1's order.
    sql: |
      WITH ranked AS (
        SELECT region_id, score AS overall_score
        FROM `se-healthcare-analytics.reporting.rpt_experience_by_region`
        WHERE measure_code = 'overall_experience'
      )
      SELECT
        exp.region_short_name,
        exp.measure_name,
        -- + 0.0 turns ROUND's -0.0 into 0
        ROUND(exp.deviation_from_national, 1) + 0.0 AS deviation_from_national
      FROM `se-healthcare-analytics.reporting.rpt_experience_by_region` AS exp
      INNER JOIN ranked USING (region_id)
      WHERE NOT exp.is_national
      ORDER BY ranked.overall_score DESC, exp.region_short_name, exp.measure_order

  measure_ranges:
    notes: >
      Per measure (overall experience first, then the dimensions): the lowest and highest regional
      score, Sweden's score and the range as label text.
    sql: |
      SELECT
        measure_name,
        measure_order,
        MIN(IF(is_national, NULL, score)) AS lowest_region_score,
        MAX(IF(is_national, NULL, score)) AS highest_region_score,
        MAX(IF(is_national, score, NULL)) AS sweden_score,
        FORMAT('%.1f–%.1f', MIN(IF(is_national, NULL, score)), MAX(IF(is_national, NULL, score))) AS range_label
      FROM `se-healthcare-analytics.reporting.rpt_experience_by_region`
      GROUP BY 1, 2
      ORDER BY measure_order

  question_scores:
    notes: >
      The selected region's score per question (Sweden by default), lowest first, with Sweden's score
      for the marker layer and the dimension for colour.
    sql: |
      SELECT
        question_short_name,
        dimension_name,
        score,
        national_score,
        ROW_NUMBER() OVER (ORDER BY score, question_number) AS row_order
      FROM `se-healthcare-analytics.reporting.rpt_experience_by_question`
      WHERE {% if question_region is defined and question_region %}{{ filter('region_short_name', question_region) }}{% else %}is_national{% endif %}
      ORDER BY row_order

charts:
  kpi_sweden:
    type: kpi
    query: kpi_summary
    label: "Sweden, overall experience"
    value: sweden_score
    notes: Sweden's overall experience score (0-100) for the doctor visit.
    style:
      value:
        format: { spec: ".1f", suffix: " / 100" }
    support:
      value: survey_label

  kpi_regions:
    type: kpi
    query: kpi_summary
    label: "Regions clearly above / below Sweden"
    value: regions_above_below
    notes: Regions whose whole confidence interval lies above or below Sweden's overall experience score.
    support:
      value: regions_label

  kpi_centres_below:
    type: kpi
    query: kpi_summary
    label: "Health centres clearly below Sweden"
    value: centres_below_share
    notes: Share of health centres whose whole confidence interval lies below Sweden's overall experience score.
    style:
      value:
        format: percent
    support:
      value: centres_below_label

  kpi_weakest:
    type: kpi
    query: kpi_summary
    label: "Sweden's weakest dimension"
    value: weakest_dimension
    notes: Sweden's lowest-scoring NPE dimension and question.
    support:
      value: weakest_question

  overall_by_region:
    type: bar
    query: overall_by_region
    title: "1. Overall experience by region"
    subtitle: "Score 0–100. Teal / amber = interval wholly above / below Sweden (dashed); grey = not clear"
    notes: >
      Ranks regions by overall experience against Sweden (dashed line); colour says whether the
      region's confidence interval clears Sweden's score, the label gives the difference in points.
    x: region_short_name
    y: score
    color: comparison_to_national
    x_label: "Region"
    height: 400
    sort: { by: row_order, order: asc }
    warnings_ignore: [WARN-LAYERED-CHART-SHARED-Y-AXIS-SCALE-MISMATCH]
    style:
      orientation: horizontal
      overlap: full
      number_format: integer
      # clearly above / clearly below / not clearly different. Set here, not in category_colors:
      # a chart with layers ignores those pins
      color:
        categorical:
          palette: [dbt-seq-teal.5, dbt-seq-amber.5, dbt-grays.muted]
      marks:
        bar:
          max_size: 12
          labels:
            visible: true
            field: score_bar_label
            position: above
      axis_x: &compact_band_labels
        labels: { min_gap: 3 }
      axis_y:
        title: { visible: false }
      legend:
        visible: false
    layers:
      - type: line
        y: national_score
        label: "Sweden"
        style:
          marks:
            line:
              stroke: { color: dbt-grays.canvas, width: 2, dasharray: "4 3" }
              labels:
                visible: true
                field: score_line_label
                position: right
            point: { size: 0 }

  centres_below_by_region:
    type: bar
    query: overall_by_region
    title: "2. Health centres clearly below Sweden"
    subtitle: "Share of each region's health centres whose interval lies below Sweden's overall score. Same order as chart 1"
    notes: >
      Per region, the share of health centres whose whole confidence interval lies below Sweden's
      overall experience score, against the national share (dashed line); label = centres of centres scored.
    x: region_short_name
    y: share_of_centres_clearly_below_national
    x_label: "Region"
    height: 400
    sort: { by: row_order, order: asc }
    warnings_ignore: [WARN-LAYERED-CHART-SHARED-Y-AXIS-SCALE-MISMATCH]
    style:
      orientation: horizontal
      number_format: percent_whole
      color:
        categorical:
          palette: [dbt-seq-amber.5]
      marks:
        bar:
          max_size: 12
          labels:
            visible: true
            field: below_bar_label
            position: above
      axis_x: *compact_band_labels
      axis_y:
        title: { visible: false }
      legend:
        visible: false
    layers:
      - type: line
        y: national_share_below
        label: "Sweden"
        style:
          marks:
            line:
              stroke: { color: dbt-grays.canvas, width: 2, dasharray: "4 3" }
              labels:
                visible: true
                field: below_line_label
                position: right
            point: { size: 0 }

  dimension_heat:
    type: table
    query: dimension_heat
    title: "3. Difference from Sweden by dimension"
    subtitle: "Points above (teal) or below (orange) Sweden's score for the same measure. Regions in chart 1's order"
    notes: >
      Region × measure difference from Sweden as a heat table, diverging around 0 on a fixed ±6 point
      scale so all columns share one scale (values beyond clamp; the printed number stays exact).
    rows: [region_short_name]
    columns: [measure_name]
    values: [deviation_from_national]
    style:
      wrap: false
      row: { height: 20 }
      columns:
        region_short_name: { label: "Region", width: 150 }
        deviation_from_national:
          format: { spec: "+.1f" }
          align: center
          # orange below Sweden, teal above, luminance-matched arms like the cost board's growth table
          scale:
            background:
              palette: [dbt-div-orange-teal-dark.3, dbt-div-orange-teal-dark.4, dbt-div-orange-teal-dark.6, dbt-div-orange-teal-dark.7, dbt-div-orange-teal-dark.8]
              min: -6
              max: 6
              hinge: 0

  measure_ranges:
    type: bar
    query: measure_ranges
    title: "4. Range between regions, by dimension"
    subtitle: "Bar = lowest to highest regional score (label); white marker = Sweden"
    notes: >
      Floating bars from the lowest to the highest regional score per measure, with Sweden's score
      as a marker: how far regions spread on each dimension, and where Sweden sits.
    x: measure_name
    y: highest_region_score
    y_start: lowest_region_score
    x_label: "Measure"
    height: 420
    sort: { by: measure_order, order: asc }
    warnings_ignore: [WARN-LAYERED-CHART-SHARED-Y-AXIS-SCALE-MISMATCH]
    style:
      orientation: horizontal
      number_format: integer
      color:
        categorical:
          palette: [dbt-seq-teal.4]
      marks:
        bar:
          max_size: 14
          labels:
            visible: true
            field: range_label
            position: above
      axis_y:
        title: { visible: false }
        scale:
          continuous:
            domain: [60, 90]
      legend:
        visible: false
    layers:
      - type: scatter
        y: sweden_score
        label: "Sweden"
        style:
          marks:
            point: { size: 60, color: dbt-grays.canvas }

  question_scores:
    type: bar
    query: question_scores
    title: "5. Question scores, lowest first"
    subtitle: "Score 0–100 for the region chosen in the filter (Sweden by default); white markers = Sweden. Colour = dimension"
    notes: >
      The selected region's 15 scored questions, lowest first, coloured by dimension, with Sweden's
      score as a marker on every row.
    x: question_short_name
    y: score
    color: dimension_name
    x_label: "Question"
    height: 420
    sort: { by: row_order, order: asc }
    warnings_ignore: [WARN-LAYERED-CHART-SHARED-Y-AXIS-SCALE-MISMATCH]
    style:
      orientation: horizontal
      overlap: full
      number_format: integer
      # dimension colours in alphabetical order of dimension_name (layers ignore category_colors)
      color:
        categorical:
          palette: [category.purple, category.blue, category.gold, category.orange, category.sky, category.green]
      marks:
        bar:
          max_size: 14
          labels:
            visible: true
            format: ".1f"
            position: above
      axis_y:
        title: { visible: false }
      legend:
        visible: true
        position: top
        direction: horizontal
        title: { visible: false }
    layers:
      - type: scatter
        y: national_score
        label: "Sweden"
        style:
          marks:
            point: { size: 50, color: dbt-grays.canvas }

rows:
  - notes: Metric definitions shown under the board title.
    text: |
      **Scores** run from 0 to 100: each answer gets a weight (100 for the best option, 0 for the worst, "don't know" left out) and the score is the average weight. A region or health centre is **clearly** above or below Sweden when its whole confidence interval lies on that side of Sweden's score.
  - height: 120
    cols: [kpi_sweden, kpi_regions, kpi_centres_below, kpi_weakest]
  - cols:
      - overall_by_region
      - centres_below_by_region
  - dimension_heat
  - cols:
      - measure_ranges
      - question_scores
  - notes: Methodology note on the NPE data and how to read it.
    rows:
      - text: "## About the data"
      - cols:
          - text: |
              **What is measured.** The National Patient Survey (Nationell Patientenkät, NPE) for primary care, 2025: patients who recently saw a doctor at a health centre rate the visit. Results are published only where at least 30 patients answered. The six dimensions group the 15 scored questions; overall experience is its own question.
          - text: |
              **What is compared.** Region and Sweden figures are SKR's own aggregates. A difference of a point or two is often within the margin of error: the region intervals are about ±1–3 points and a typical health centre's about ±9, so centre rankings say little unless the gap is large.
          - text: |
              **How to read it.** One survey round, so no trend yet. Sörmland has no results. In 2025, continuity (seeing the same doctor, a doctor who knows your history) is the weakest dimension in every region, and respectful treatment the strongest in all but Kalmar. Translations of questions and answers are unofficial.
      - text: "Source: SKR, Nationell Patientenkät primärvård 2025 (doctor visits)."
